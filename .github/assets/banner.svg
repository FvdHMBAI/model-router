    <line x1="600" y1="0" x2="600" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>
  <!-- Router icon -->
  <g transform="translate(405, 55)">
    <circle cx="50" cy="40" r="12" fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
    <circle cx="20" cy="15" r="6" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="80" cy="15" r="6" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="20" cy="65" r="6" fill="#4fc3f7" opacity="0.6"/>
