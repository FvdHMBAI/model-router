    <line x1="26" y1="19" x2="40" y2="33" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
    <line x1="74" y1="19" x2="60" y2="33" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
    <line x1="26" y1="61" x2="40" y2="47" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
    <line x1="74" y1="61" x2="60" y2="47" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
